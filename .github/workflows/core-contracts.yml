name: Observatory Core contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing Node contract tests
        run: npm test
      - name: Install JSON Schema validator
        run: python -m pip install -r requirements-schema-test.txt
      - name: Domain-neutral JSON Schema conformance
        run: python -m unittest discover -s tests -p 'test_core_schema.py'
